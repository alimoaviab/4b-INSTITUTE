kind = "web"
previewPath = "/"
title = "Student Admission & Entry Test System"
version = "1.0.0"
id = "artifacts/admission-system"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20003

[services.development]
run = "pnpm --filter @workspace/admission-system run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/admission-system", "run", "build" ]
publicDir = "artifacts/admission-system/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20003"
BASE_PATH = "/"
