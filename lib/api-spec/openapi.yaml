openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Student Admission & Entry Test Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: students
    description: Admin student management
  - name: verification
    description: Student face verification
  - name: applications
    description: Student registration applications
  - name: tests
    description: Test configuration
  - name: questions
    description: Question bank
  - name: sessions
    description: Test sessions
  - name: results
    description: Test results
  - name: interviews
    description: Interview management
  - name: violations
    description: Anti-cheating violation logs
  - name: dashboard
    description: Admin dashboard stats

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current admin user
      responses:
        "200":
          description: Current admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"

  # Students (admin-managed)
  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List all pre-uploaded students
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: program
          schema:
            type: string
        - in: query
          name: eligible
          schema:
            type: boolean
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentListResponse"
    post:
      operationId: createStudent
      tags: [students]
      summary: Add a single student record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Student created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /students/{id}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get student by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
    patch:
      operationId: updateStudent
      tags: [students]
      summary: Update student record
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdate"
      responses:
        "200":
          description: Updated student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
    delete:
      operationId: deleteStudent
      tags: [students]
      summary: Delete student record
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /students/{id}/block:
    patch:
      operationId: blockStudent
      tags: [students]
      summary: Block or unblock a suspicious student
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockStudentInput"
      responses:
        "200":
          description: Student block status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /students/bulk-import:
    post:
      operationId: bulkImportStudents
      tags: [students]
      summary: Bulk import students from CSV/Excel data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"

  # Verification
  /verification/check:
    post:
      operationId: checkStudentRecord
      tags: [verification]
      summary: Check roll number and CNIC before face verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationCheckInput"
      responses:
        "200":
          description: Record found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationCheckResponse"
        "404":
          description: No matching record

  /verification/attempt:
    post:
      operationId: submitVerificationAttempt
      tags: [verification]
      summary: Submit face verification attempt with captured image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationAttemptInput"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationAttemptResponse"

  /verification/logs:
    get:
      operationId: listVerificationLogs
      tags: [verification]
      summary: Admin - list all verification logs
      parameters:
        - in: query
          name: studentId
          schema:
            type: integer
        - in: query
          name: success
          schema:
            type: boolean
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Verification logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationLogListResponse"

  # Applications
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: Admin - list all applications
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected]
        - in: query
          name: program
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Applications list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationListResponse"
    post:
      operationId: createApplication
      tags: [applications]
      summary: Student submits registration form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /applications/{id}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get application by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
    patch:
      operationId: updateApplication
      tags: [applications]
      summary: Update application (admin approve/reject or student draft)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
    delete:
      operationId: deleteApplication
      tags: [applications]
      summary: Delete application
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /applications/by-student/{studentId}:
    get:
      operationId: getApplicationByStudent
      tags: [applications]
      summary: Get application by student ID
      parameters:
        - in: path
          name: studentId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  # Tests
  /tests:
    get:
      operationId: listTests
      tags: [tests]
      summary: List tests
      responses:
        "200":
          description: Tests list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Test"
    post:
      operationId: createTest
      tags: [tests]
      summary: Create a test configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestInput"
      responses:
        "201":
          description: Test created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Test"

  /tests/active:
    get:
      operationId: getActiveTest
      tags: [tests]
      summary: Get the currently active test for students
      responses:
        "200":
          description: Active test
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Test"

  /tests/{id}:
    get:
      operationId: getTest
      tags: [tests]
      summary: Get test by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Test
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Test"
    patch:
      operationId: updateTest
      tags: [tests]
      summary: Update test configuration
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestUpdate"
      responses:
        "200":
          description: Updated test
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Test"
    delete:
      operationId: deleteTest
      tags: [tests]
      summary: Delete test
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Questions
  /questions:
    get:
      operationId: listQuestions
      tags: [questions]
      summary: List questions
      parameters:
        - in: query
          name: testId
          schema:
            type: integer
        - in: query
          name: subject
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Questions list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionListResponse"
    post:
      operationId: createQuestion
      tags: [questions]
      summary: Add a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionInput"
      responses:
        "201":
          description: Question created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"

  /questions/bulk-import:
    post:
      operationId: bulkImportQuestions
      tags: [questions]
      summary: Bulk import questions from Excel data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkQuestionsInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"

  /questions/{id}:
    get:
      operationId: getQuestion
      tags: [questions]
      summary: Get question by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
    patch:
      operationId: updateQuestion
      tags: [questions]
      summary: Update question
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionUpdate"
      responses:
        "200":
          description: Updated question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
    delete:
      operationId: deleteQuestion
      tags: [questions]
      summary: Delete question
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Test Sessions
  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: Admin - list all test sessions
      parameters:
        - in: query
          name: studentId
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
            enum: [active, submitted, timed_out]
      responses:
        "200":
          description: Sessions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestSession"
    post:
      operationId: startTestSession
      tags: [sessions]
      summary: Student starts a test session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSessionInput"
      responses:
        "201":
          description: Session started with questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestSessionWithQuestions"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get test session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestSessionWithQuestions"

  /sessions/{id}/answer:
    post:
      operationId: saveAnswer
      tags: [sessions]
      summary: Save/update an answer during test
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAnswerInput"
      responses:
        "200":
          description: Answer saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"

  /sessions/{id}/submit:
    post:
      operationId: submitTest
      tags: [sessions]
      summary: Submit test (auto or manual)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitTestInput"
      responses:
        "200":
          description: Test submitted with result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"

  # Results
  /results:
    get:
      operationId: listResults
      tags: [results]
      summary: List all results
      parameters:
        - in: query
          name: testId
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
            enum: [pass, fail]
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Results list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultListResponse"

  /results/merit-list:
    get:
      operationId: getMeritList
      tags: [results]
      summary: Get merit list sorted by score
      parameters:
        - in: query
          name: testId
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Merit list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeritEntry"

  /results/{id}:
    get:
      operationId: getResult
      tags: [results]
      summary: Get result by ID with answers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Result with answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultDetail"

  /results/by-student/{studentId}:
    get:
      operationId: getResultByStudent
      tags: [results]
      summary: Get result by student ID
      parameters:
        - in: path
          name: studentId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"

  # Interviews
  /interviews:
    get:
      operationId: listInterviews
      tags: [interviews]
      summary: List all interviews
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [scheduled, completed, rejected]
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Interviews list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewListResponse"
    post:
      operationId: createInterview
      tags: [interviews]
      summary: Schedule an interview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewInput"
      responses:
        "201":
          description: Interview scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interview"

  /interviews/{id}:
    get:
      operationId: getInterview
      tags: [interviews]
      summary: Get interview by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Interview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interview"
    patch:
      operationId: updateInterview
      tags: [interviews]
      summary: Update interview notes/status/remarks
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewUpdate"
      responses:
        "200":
          description: Updated interview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interview"
    delete:
      operationId: deleteInterview
      tags: [interviews]
      summary: Delete interview
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Violations
  /violations:
    get:
      operationId: listViolations
      tags: [violations]
      summary: List anti-cheating violations
      parameters:
        - in: query
          name: sessionId
          schema:
            type: integer
        - in: query
          name: studentId
          schema:
            type: integer
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Violations list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViolationListResponse"
    post:
      operationId: reportViolation
      tags: [violations]
      summary: Report a cheating violation during test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViolationInput"
      responses:
        "201":
          description: Violation logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Violation"

  # Dashboard
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get admin dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/registrations-chart:
    get:
      operationId: getRegistrationsChart
      tags: [dashboard]
      summary: Daily registrations over last 30 days
      responses:
        "200":
          description: Daily registration data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChartDataPoint"

  /dashboard/pass-fail-chart:
    get:
      operationId: getPassFailChart
      tags: [dashboard]
      summary: Pass vs fail ratio by program
      responses:
        "200":
          description: Pass/fail data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PassFailDataPoint"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent activity feed
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # Auth
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    Admin:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string

    AuthResponse:
      type: object
      required: [token, admin]
      properties:
        token:
          type: string
        admin:
          $ref: "#/components/schemas/Admin"

    # Student
    Student:
      type: object
      required: [id, rollNumber, cnic, name, fatherName, phone, program, isEligible, isBlocked, createdAt]
      properties:
        id:
          type: integer
        rollNumber:
          type: string
        cnic:
          type: string
        name:
          type: string
        fatherName:
          type: string
        phone:
          type: string
        schoolCollege:
          type: ["string", "null"]
        program:
          type: string
        photoUrl:
          type: ["string", "null"]
        isEligible:
          type: boolean
        isBlocked:
          type: boolean
        blockReason:
          type: ["string", "null"]
        createdAt:
          type: string

    StudentInput:
      type: object
      required: [rollNumber, cnic, name, fatherName, phone, program]
      properties:
        rollNumber:
          type: string
        cnic:
          type: string
        name:
          type: string
        fatherName:
          type: string
        phone:
          type: string
        schoolCollege:
          type: string
        program:
          type: string
        photoUrl:
          type: string
        isEligible:
          type: boolean

    StudentUpdate:
      type: object
      properties:
        rollNumber:
          type: string
        cnic:
          type: string
        name:
          type: string
        fatherName:
          type: string
        phone:
          type: string
        schoolCollege:
          type: string
        program:
          type: string
        photoUrl:
          type: string
        isEligible:
          type: boolean

    StudentListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
